# Author: Frank Loewenich
# Keep MAVROS light: only the plugins the mission controller uses.
/**:
  ros__parameters:
    plugin_allowlist:
      - sys_status
      - sys_time
      - command
      - local_position
      - global_position
      - setpoint_position
      - setpoint_raw
      - imu
      - home_position
      - param
