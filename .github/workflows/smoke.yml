name: headless smoke run

# Started by hand from the Actions tab (workflow_dispatch) rather than on every push, to keep the
# Actions minutes down: the image build takes about 20 minutes when the GHCR layer cache misses
# (PX4 and ros_gz from source) and the smoke run itself a few minutes on the CPU renderer with the
# lite camera and the oracle detector, no weights needed. Last green run: 2026-09-17.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        # The image with ROS 2, Gazebo, PX4 and CPU torch needs more than the runner's spare disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af > /dev/null
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (cached) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          load: true
          tags: uav-dt-smoke:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/smoke-cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/smoke-cache,mode=max
      - name: Style and docstring check
        run: docker run --rm uav-dt-smoke:ci bash -lc "source scripts/env.sh && pip install -q ruff && ruff check ."
      - name: Unit tests and offline smoke
        run: docker run --rm uav-dt-smoke:ci bash -lc "source scripts/env.sh && python -m pytest && python smoke_test.py"
      - name: Headless sim smoke run
        run: docker run --rm -v ${{ github.workspace }}/runs:/repo/runs uav-dt-smoke:ci
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run
          path: |
            runs/**/*.md
            runs/**/*.log
            runs/**/*.jsonl
          if-no-files-found: ignore
